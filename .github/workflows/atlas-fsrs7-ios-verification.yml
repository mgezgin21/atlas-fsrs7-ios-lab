name: Atlas FSRS-7 iOS Native + Flutter FFI Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-fsrs7-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-fsrs7-native-and-simulator:
    name: iPhone ARM64 + iOS Simulator FFI (isolated)
    runs-on: macos-15
    timeout-minutes: 95
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
      RUST_BACKTRACE: '1'
      EXPECTED_UPSTREAM: '0a5737406a0c5c7a5259b144738cbe4a0b649d76'
      NONCE: '${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - name: Check out isolated FFI project
        uses: actions/checkout@v4
      - name: Toolchain / Apple Silicon / Xcode details
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = 'arm64'
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list devices available
      - name: Install Rust for iPhone and ARM64 simulator
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: atlas-fsrs7-ios-pinned-v1
      - name: Pin and check FSRS-7 Rust source
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'rev = "[0-9a-f]*"' Cargo.toml | head -1 | cut -d'"' -f2)" = "$EXPECTED_UPSTREAM"
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/fsrs7-metadata.json"
          python3 - "$RUNNER_TEMP/fsrs7-metadata.json" "$EXPECTED_UPSTREAM" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          matching=[p for p in data['packages'] if p['name']=='fsrs' and sys.argv[2] in (p['source'] or '')]
          assert len(matching)==1, 'FSRS dependency revision differs from pinned source'
          print('FSRS7_PINNED_SOURCE=PASS;REV='+sys.argv[2])
          PY
          shasum -a 256 Cargo.lock
      - name: Compile iPhone ARM64 Rust static archive
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-ios
          file target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a
          xcrun lipo -info target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a
      - name: Compile iOS Simulator ARM64 Rust static archive
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-ios-sim
          file target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a
          xcrun lipo -info target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a
          # Apple Xcode 16.4 nm uses an older LLVM reader than rustc 1.99's
          # LLVM 23. Scanning every member of Rust staticlib produces
          # "Unknown attribute kind" even when both cross-builds succeeded.
          # Check archive structure here; prove public FFI symbols with the
          # *real* C link step below, then with Flutter/Dart in Simulator.
          for a in target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a; do
            test -s "$a"
            xcrun ar -t "$a" > "$RUNNER_TEMP/$(basename "$(dirname "$(dirname "$a")")")-archive-members.txt"
            test -s "$RUNNER_TEMP/$(basename "$(dirname "$(dirname "$a")")")-archive-members.txt"
            shasum -a 256 "$a"
          done
          echo 'IOS_DEVICE_AND_SIM_ARM64_LIBS=PASS;SYMBOL_LINK_TEST=NEXT'
      - name: Standalone C / iOS Simulator linker probe
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator clang \
            -arch arm64 -isysroot "$SDK" -mios-simulator-version-min=14.0 \
            tests/ios/ffi_link_probe.c \
            target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a \
            -framework Foundation -framework Security -framework SystemConfiguration \
            -lresolv -lc++ -o "$RUNNER_TEMP/atlas_fsrs7_ios_link_probe"
          file "$RUNNER_TEMP/atlas_fsrs7_ios_link_probe"
          echo 'IOS_C_FFI_LINK_PROBE=PASS'
      - name: Install Flutter for isolated iOS probe
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Create isolated Flutter app and static Rust bindings
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter create --platforms ios --org com.gezgintechnologies --project-name atlas_fsrs7_ios_probe ios_build/atlas_fsrs7_ios_probe
          cd ios_build/atlas_fsrs7_ios_probe
          flutter pub add 'ffi:^2.1.4'
          cp ../../ios_probe/main.dart lib/main.dart
          mkdir -p ios/NativeRust/device ios/NativeRust/simulator
          cp ../../target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a ios/NativeRust/device/
          cp ../../target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a ios/NativeRust/simulator/
          ruby ../../scripts/ios/patch_runner_link.rb ios/Runner.xcodeproj
          flutter analyze
      - name: Build iOS Simulator Flutter Debug/AOT-independent FFI
        shell: bash
        run: |
          set -euo pipefail
          cd ios_build/atlas_fsrs7_ios_probe
          flutter build ios --simulator --debug --no-codesign --dart-define=ATLAS_FSRS7_IOS_NONCE="$NONCE"
          test -d build/ios/iphonesimulator/Runner.app
          echo 'IOS_SIMULATOR_FLUTTER_DEBUG_LINK=PASS'
      - name: Boot simulator and execute REAL Dart -> static Rust FFI
        shell: bash
        run: |
          set -euo pipefail
          cd ios_build/atlas_fsrs7_ios_probe
          DEVICE="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[v["udid"] for devices in d.values() for v in devices if v.get("isAvailable") and "iPhone" in v.get("name", "")]; print(a[0] if a else "")')"
          test -n "$DEVICE" || { echo 'No available iPhone simulator runtime'; exit 1; }
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$PWD/build/ios/iphonesimulator/Runner.app"
          ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$ID"
          DATA="$(xcrun simctl get_app_container "$DEVICE" "$ID" data)"
          MARKER="$DATA/tmp/atlas-fsrs7-ios-result.txt"
          echo "Expected isolated marker in simulator app sandbox: $MARKER"
          PASS=0
          for i in $(seq 1 75); do
            if [ -f "$MARKER" ]; then
              cat "$MARKER"
              grep -Fxq 'STATUS=PASS' "$MARKER"
              grep -Fxq "NONCE=$NONCE" "$MARKER"
              grep -q 'ENGINE=7 ABI=1 PARAMS=34 MEMORY=12 OUTPUT=64' "$MARKER"
              grep -q 'PLATFORM=ios' "$MARKER"
              PASS=1
              break
            fi
            sleep 2
          done
          if [ "$PASS" -ne 1 ]; then
            echo 'No valid simulator runtime marker; showing recent Runner diagnostics'
            xcrun simctl spawn "$DEVICE" log show --last 4m --style compact --predicate 'process == "Runner"' | tail -n 80 || true
            exit 1
          fi
          echo 'IOS_SIMULATOR_REAL_DART_STATIC_RUST_FFI=PASS'
      - name: Build iPhone ARM64 Flutter Release (unsigned, no device execution)
        shell: bash
        run: |
          set -euo pipefail
          cd ios_build/atlas_fsrs7_ios_probe
          flutter build ios --release --no-codesign --dart-define=ATLAS_FSRS7_IOS_NONCE="$NONCE"
          test -d build/ios/iphoneos/Runner.app
          file build/ios/iphoneos/Runner.app/Runner
          echo 'IOS_IPHONE_ARM64_FLUTTER_RELEASE_LINK=PASS'
      - name: Upload evidence, libraries, and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-fsrs7-ios-evidence-${{ github.run_id }}
          path: |
            Cargo.lock
            target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a
            target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a
            ios_build/atlas_fsrs7_ios_probe/pubspec.lock
          if-no-files-found: warn
          retention-days: 7
