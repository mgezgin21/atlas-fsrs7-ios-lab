name: Atlas FSRS-7 iOS Native + Flutter FFI Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-fsrs7-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-fsrs7-native-and-simulator:
    name: iPhone ARM64 + Universal Simulator FFI (isolated)
    runs-on: macos-15
    timeout-minutes: 95
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'off'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
      RUST_BACKTRACE: '1'
      EXPECTED_UPSTREAM: '0a5737406a0c5c7a5259b144738cbe4a0b649d76'
      NONCE: '${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - name: Check out isolated FFI project
        uses: actions/checkout@v4
      - name: Toolchain / Apple Silicon / Xcode details
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = 'arm64'
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun simctl list devices available
      - name: Install Rust for iPhone and both simulator architectures
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: atlas-fsrs7-ios-universal-v2
      - name: Pin and check FSRS-7 Rust source
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'rev = "[0-9a-f]*"' Cargo.toml | head -1 | cut -d'"' -f2)" = "$EXPECTED_UPSTREAM"
          rustc --version
          cargo --version
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/fsrs7-metadata.json"
          python3 - "$RUNNER_TEMP/fsrs7-metadata.json" "$EXPECTED_UPSTREAM" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          matching=[p for p in data['packages'] if p['name']=='fsrs' and sys.argv[2] in (p['source'] or '')]
          assert len(matching)==1, 'FSRS dependency revision differs from pinned source'
          print('FSRS7_PINNED_SOURCE=PASS;REV='+sys.argv[2])
          PY
          shasum -a 256 Cargo.lock
      - name: Compile iPhone ARM64 Rust static archive
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-ios
          file target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a
          xcrun lipo -info target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a
      - name: Compile both Simulator Rust archives and assemble universal library
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-ios-sim
          cargo build --release --locked --target x86_64-apple-ios
          SIM_FAT="target/atlas_fsrs7_simulator_universal.a"
          xcrun lipo -create \
            target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a \
            target/x86_64-apple-ios/release/libatlas_fsrs7_probe.a \
            -output "$SIM_FAT"
          xcrun lipo "$SIM_FAT" -verify_arch arm64 x86_64
          file "$SIM_FAT"
          xcrun lipo -info "$SIM_FAT"
          for archive in target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a target/x86_64-apple-ios/release/libatlas_fsrs7_probe.a; do
            test -s "$archive"
            xcrun ar -t "$archive" > "$RUNNER_TEMP/archive-members-$(basename "$(dirname "$(dirname "$archive")")").txt"
            shasum -a 256 "$archive"
          done
          shasum -a 256 "$SIM_FAT"
          echo 'IOS_DEVICE_AND_UNIVERSAL_SIMULATOR_ARCHIVES=PASS'

      - name: Independently link C to iOS Simulator Rust for BOTH architectures
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          for ARCH in arm64 x86_64; do
            xcrun --sdk iphonesimulator clang \
              -arch "$ARCH" -isysroot "$SDK" -mios-simulator-version-min=14.0 \
              tests/ios/ffi_link_probe.c \
              target/atlas_fsrs7_simulator_universal.a \
              -framework Foundation -framework Security -framework SystemConfiguration \
              -lresolv -lc++ -o "$RUNNER_TEMP/fsrs7-ios-link-$ARCH"
            file "$RUNNER_TEMP/fsrs7-ios-link-$ARCH"
          done
          echo 'IOS_C_FFI_UNIVERSAL_LINK_PROBE=PASS'

      - name: Install Flutter for isolated iOS probe
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Create isolated Flutter app and static Rust bindings
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter create --platforms ios --org com.gezgintechnologies --project-name atlas_fsrs7_ios_probe ios_build/atlas_fsrs7_ios_probe
          cd ios_build/atlas_fsrs7_ios_probe
          flutter pub add 'ffi:^2.1.4'
          cp ../../ios_probe/main.dart lib/main.dart
          mkdir -p ios/NativeRust/device ios/NativeRust/simulator
          cp ../../target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a ios/NativeRust/device/
          cp ../../target/atlas_fsrs7_simulator_universal.a ios/NativeRust/simulator/libatlas_fsrs7_probe.a
          xcrun lipo ios/NativeRust/simulator/libatlas_fsrs7_probe.a -verify_arch arm64 x86_64
          ruby ../../scripts/ios/patch_runner_link.rb ios/Runner.xcodeproj simulator
          python3 ../../scripts/ios/verify_xcode_link.py ios/Runner.xcodeproj simulator Debug
          # Flutter's generated widget_test.dart expects the deleted template
          # MyApp class. Replace it with an ABI contract test for THIS probe.
          # The host test validates Dart layouts, not iOS native execution;
          # the simulator job below remains the real native acceptance.
          cat > test/widget_test.dart <<'DART'
          import 'dart:ffi';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:atlas_fsrs7_ios_probe/main.dart' as lab;

          void main() {
            test('FSRS-7 ABI 1 Dart struct sizes', () {
              expect(sizeOf<lab.Memory>(), 12);
              expect(sizeOf<lab.Choice>(), 16);
              expect(sizeOf<lab.Next>(), 64);
            });
          }
          DART
          flutter analyze
          flutter test test/widget_test.dart
          echo 'IOS_DART_FFI_LAYOUT_TEST=PASS'
      - name: Build iOS Simulator Flutter Debug/AOT-independent FFI
        shell: bash
        run: |
          set -euo pipefail
          cd ios_build/atlas_fsrs7_ios_probe
          # Capture the real Xcode link invocation. flutter normally hides it,
          # which made the previous undefined-symbol failures opaque.
          BUILD_LOG="$RUNNER_TEMP/atlas-fsrs7-ios-simulator-build.log"
          if ! flutter build ios --simulator --debug --no-codesign --dart-define=ATLAS_FSRS7_IOS_NONCE="$NONCE" -v > "$BUILD_LOG" 2>&1; then
            echo 'IOS_SIMULATOR_FLUTTER_LINK=FAIL;ACTUAL_LINK_COMMAND_DIAGNOSTICS:'
            grep -En 'NativeRust|libatlas_fsrs7_probe|Undefined symbol|undefined symbol|ld: |clang.*-o |Ld .*Runner|OTHER_LDFLAGS| -u _atlas_fsrs7' "$BUILD_LOG" | tail -n 90 || true
            tail -n 110 "$BUILD_LOG"
            exit 1
          fi
          echo 'IOS_SIMULATOR_FLUTTER_LINK=PASS'
          test -d build/ios/iphonesimulator/Runner.app
          # Xcode 16 Debug executable is a stub; Rust lives in Runner.debug.dylib.
          BIN="build/ios/iphonesimulator/Runner.app/Runner.debug.dylib"
          if [ ! -f "$BIN" ]; then BIN="build/ios/iphonesimulator/Runner.app/Runner"; fi
          file "$BIN"
          for ARCH in arm64 x86_64; do
            xcrun nm -arch "$ARCH" -gj "$BIN" > "$RUNNER_TEMP/fsrs7-sim-$ARCH-exports.txt"
            for symbol in atlas_fsrs7_engine_version atlas_fsrs7_abi_version atlas_fsrs7_parameter_count atlas_fsrs7_state_size atlas_fsrs7_output_size atlas_fsrs7_next; do
              grep -Fxq "_${symbol}" "$RUNNER_TEMP/fsrs7-sim-$ARCH-exports.txt" || { echo "Missing $ARCH Debug export: $symbol"; exit 1; }
            done
          done
          echo "IOS_SIMULATOR_DEBUG_DYLIB_EXPORTED_RUST_SYMBOLS=PASS"
          echo 'IOS_SIMULATOR_FLUTTER_DEBUG_LINK=PASS'
      - name: Boot simulator and execute REAL Dart -> static Rust FFI
        shell: bash
        run: |
          set -euo pipefail
          cd ios_build/atlas_fsrs7_ios_probe
          DEVICE="$(xcrun simctl list -j devices available | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[v["udid"] for devices in d.values() for v in devices if v.get("isAvailable") and "iPhone" in v.get("name", "")]; print(a[0] if a else "")')"
          test -n "$DEVICE" || { echo 'No available iPhone simulator runtime'; exit 1; }
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP="$PWD/build/ios/iphonesimulator/Runner.app"
          ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$ID"
          DATA="$(xcrun simctl get_app_container "$DEVICE" "$ID" data)"
          MARKER="$DATA/tmp/atlas-fsrs7-ios-result.txt"
          echo "Expected isolated marker in simulator app sandbox: $MARKER"
          PASS=0
          for i in $(seq 1 75); do
            if [ -f "$MARKER" ]; then
              cat "$MARKER"
              grep -Fxq 'STATUS=PASS' "$MARKER"
              grep -Fxq "NONCE=$NONCE" "$MARKER"
              grep -q 'ENGINE=7 ABI=1 PARAMS=34 MEMORY=12 OUTPUT=64' "$MARKER"
              grep -q 'PLATFORM=ios' "$MARKER"
              PASS=1
              break
            fi
            sleep 2
          done
          if [ "$PASS" -ne 1 ]; then
            echo 'No valid simulator runtime marker; showing recent Runner diagnostics'
            xcrun simctl spawn "$DEVICE" log show --last 4m --style compact --predicate 'process == "Runner"' | tail -n 80 || true
            exit 1
          fi
          echo 'IOS_SIMULATOR_REAL_DART_STATIC_RUST_FFI=PASS'
      - name: Build iPhone ARM64 Flutter Release (unsigned, no device execution)
        shell: bash
        run: |
          set -euo pipefail
          cd ios_build/atlas_fsrs7_ios_probe
          ruby ../../scripts/ios/patch_runner_link.rb ios/Runner.xcodeproj device
          python3 ../../scripts/ios/verify_xcode_link.py ios/Runner.xcodeproj device Release
          flutter build ios --release --no-codesign --dart-define=ATLAS_FSRS7_IOS_NONCE="$NONCE"
          test -d build/ios/iphoneos/Runner.app
          xcrun nm -gj build/ios/iphoneos/Runner.app/Runner > "$RUNNER_TEMP/fsrs7-device-exports.txt"
          for symbol in atlas_fsrs7_engine_version atlas_fsrs7_abi_version atlas_fsrs7_parameter_count atlas_fsrs7_state_size atlas_fsrs7_output_size atlas_fsrs7_next; do
            grep -Fxq "_${symbol}" "$RUNNER_TEMP/fsrs7-device-exports.txt" || { echo "Missing exported iPhone symbol: $symbol"; exit 1; }
          done
          echo "IOS_IPHONE_EXPORTED_RUST_SYMBOLS=PASS"
          file build/ios/iphoneos/Runner.app/Runner
          echo 'IOS_IPHONE_ARM64_FLUTTER_RELEASE_LINK=PASS'
      - name: Upload evidence, libraries, and generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-fsrs7-ios-evidence-${{ github.run_id }}
          path: |
            Cargo.lock
            target/aarch64-apple-ios/release/libatlas_fsrs7_probe.a
            target/aarch64-apple-ios-sim/release/libatlas_fsrs7_probe.a
            target/x86_64-apple-ios/release/libatlas_fsrs7_probe.a
            target/atlas_fsrs7_simulator_universal.a
            ios_build/atlas_fsrs7_ios_probe/pubspec.lock
            ${{ runner.temp }}/atlas-fsrs7-ios-simulator-build.log
          if-no-files-found: warn
          retention-days: 7
