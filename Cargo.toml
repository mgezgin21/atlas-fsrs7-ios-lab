[package]
name = "atlas_fsrs7_probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Atlas isolated FSRS-7 ABI and platform feasibility probe; not production integration"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# NOT fsrs = '=6.6.2': that released crate contains FSRS-6 only.
# 34-parameter FSRS-7 is in this PINNED upstream source revision.
[dependencies]
fsrs = { git = "https://github.com/open-spaced-repetition/fsrs-rs", rev = "0a5737406a0c5c7a5259b144738cbe4a0b649d76" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
